# The E5 has no keyboard, and a bring-up kernel has no usable suspend: a power-key
# press must not power the machine off, and nothing may try to suspend it.  Plasma
# Mobile drives the key itself (powerdevil), so logind is told to keep its hands off.
# Symptom this fixes: pressing power to wake the screen instead powered the device
# off (logind's default HandlePowerKey=poweroff).
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
IdleAction=ignore
