# DHCP + DNS for the E5's LAN, br0: the Wi-Fi hotspot and the USB port share
# 192.168.9.0/24 (opt/e5/net-bridge.sh).  Until 2026-09-26 they were two LANs,
# usb0 192.168.77.1 and wlan0 192.168.9.1.
#
# networkd's DHCPServer can hand out addresses but cannot answer queries, so
# clients ended up with a resolver that never replied ("got an address, no
# internet").  dnsmasq serves both, advertises itself, and forwards to the
# resolvers the system already has (/etc/resolv.conf, which e5-mobile-data
# writes from AT+CGCONTRDP).
#
# usb0 used to be the exception -- "usb0's leases stay with systemd-networkd" --
# and that is exactly what stopped the management LAN from working: networkd's
# own configuration of usb0 times out on this kernel
#
#     usb0: Failed to wait for the interface to be initialized: Connection timed out
#
# (the sprd SIPA pseudo-interfaces make its rtnl requests hang), so the address
# lands but the server never starts, and the host is left with a self-assigned
# address until someone types one in by hand.
#
# bind-dynamic: br0 is made by e5-net-bridge before this starts, but its IPv6
# address arrives later (e5-ipv6-share, once the bearer is up).
interface=br0
bind-dynamic
# The only DHCP server on this LAN: NAK a lease it did not hand out, so a host
# still holding the initramfs's 192.168.77.x (rescue mode) or a lease from the
# two-LAN days moves to 192.168.9.x at its next renewal instead of when the old
# lease expires.
dhcp-authoritative

dhcp-range=set:lan,192.168.9.10,192.168.9.200,255.255.255.0,12h
dhcp-option=tag:lan,option:router,192.168.9.1
dhcp-option=tag:lan,option:dns-server,192.168.9.1

# The host on the USB port: its MAC is the gadget's fixed host_addr (boot/init),
# and it always gets 192.168.9.2 (outside the pool), so host-side tooling has a
# fixed address to serve from.  It gets an address but no router -- a laptop on this port must keep routing its
# internet traffic through its own default gateway, not through the phone.  (The
# IPv6 RA below is per link, so it does see the phone as an IPv6 router; which
# one a laptop uses is its own service order.)
dhcp-host=02:50:00:00:e5:02,192.168.9.2,set:usbhost
dhcp-option=tag:usbhost,option:router

# IPv6: the bearer's public /64, which e5-ipv6-share puts on br0 as <prefix>::1.
# constructor:br0 advertises whatever global prefix br0 holds (and follows it
# when a new bearer brings a new one); clients build SLAAC addresses in it, and
# the RA carries this resolver (RDNSS).  ra-stateless also answers stateless
# DHCPv6 for clients that ask for DNS that way.
enable-ra
dhcp-range=set:lan6,::,constructor:br0,ra-stateless,64,1h
# [::] = this server's own address in the advertised prefix (the global ::1),
# not the link-local dnsmasq would otherwise put in RDNSS.
dhcp-option=tag:lan6,option6:dns-server,[::]
log-dhcp
