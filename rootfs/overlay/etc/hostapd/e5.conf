interface=wlan0
driver=nl80211
ssid=E5-Linux
country_code=CN
# 5 GHz, channel 149.  Width stays at 20 MHz on purpose: this is the SC2355 "marlin3_lite"
# firmware, and anything wider makes hostapd hang in its HT_SCAN state before the AP ever
# starts ("COUNTRY_UPDATE->HT_SCAN" and nothing after).  40 MHz with ht_capab=[HT40+] hangs
# the same way, so it is the chip, not the VHT settings.  e5-2g.conf is the 2.4 GHz
# fallback; e5-5g80.conf keeps the 80 MHz attempt for reference.
hw_mode=a
channel=149
ieee80211d=1
ieee80211n=1
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
