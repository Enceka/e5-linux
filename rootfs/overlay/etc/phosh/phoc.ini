# phoc configuration for the E5.
#
# The panel is 320x480 at ~166 DPI while phosh lays its UI out for something
# closer to 360x720, so the output scale is a compromise (docs/FINDINGS.md 21):
# 0.85 renders 376x565 logical pixels and resamples them down to the panel.
# The owner tried 1 (the panel's own size), 0.9 and 0.85 in use on 2026-09-26
# and settled on 0.85: at 1 and 0.9 too many buttons ended up off the screen
# with the text scaled up in Settings.  Measured at 0.85: the on-screen
# keyboard fits, the lock screen's unlock button is just cut -- the keypad's
# confirm key submits the PIN (FINDINGS 12.1).
#
# To try another scale in a running session: wlr-randr --output DSI-1
# --scale <s> (as the session user, with the screen on; it cannot be applied
# while the panel is blanked).
[output:DSI-1]
scale = 0.85

[core]
xwayland = false
