# Nothing on the E5 waits for NetworkManager: the LAN (br0, usb0) and the
# bearer are configured by e5-net-bridge and e5-bearer-up, and NM only manages
# Wi-Fi, whose station connection comes up when a user asks for it.  Holding
# network-online.target on it is what once cost minutes at every boot
# (docs/FINDINGS.md 26), so this unit is a no-op, like
# systemd-networkd-wait-online's.
[Service]
ExecStart=
ExecStart=/bin/true
