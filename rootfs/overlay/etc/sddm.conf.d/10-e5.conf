# Phosh is the session (lightest of the two); Plasma Mobile is still installed and
# selectable -- sddm offers both, and switching back is this one line.
#   Session=plasma-mobile.desktop
[Autologin]
User=e5
Session=phosh.desktop
Relogin=false

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
