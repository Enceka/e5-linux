[Unit]
# Pull systemd-networkd in for usb0's management network (see
# /etc/systemd/network/10-e5-usb0.network).  Doing it with a drop-in rather than by
# enabling the unit keeps the overlay plain files only: it travels into the initramfs,
# which cannot carry symlinks.
Wants=systemd-networkd.service
After=systemd-networkd.service
