[Manager]
# A reboot is the CP watchdog's only recovery, so it must not depend on every
# vendor-backed service stopping politely.  Measured 2026-09-18: btattach ignores
# SIGTERM (hence KillSignal=SIGKILL in its unit).  Cap the wait instead of
# letting one wedged service
# hold the box.
DefaultTimeoutStopSec=5s
