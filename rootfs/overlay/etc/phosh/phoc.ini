# phoc configuration for the E5.
#
# The panel is 320x480 at ~166 DPI and the shell needs a little more width than
# that (the on-screen keyboard's own layout is ~339 px, and GTK apps often have
# minimum widths around 360).  Two settings were measured on 2026-09-18:
#
#   scale = 1     -> grim captures 320x480, pixels are 1:1 and text is sharp,
#                    but whatever is wider than 320 (the OSK's rightmost key, a
#                    wide dialog) is cut off at the right edge.
#   scale = 0.9   -> logical 356x533: the OSK fits with its margins and most
#                    dialogs do too.  The cost is that GTK still renders at 1x
#                    and the compositor resamples by 10%, so text is slightly
#                    soft -- nothing like 0.75, which is a 25% resample.
#
# 0.9 is what is set below (chosen for "the whole UI has to be visible"), with
# org.gnome.desktop.interface text-scaling-factor = 0.85 keeping text small
# enough to fit.  Set scale = 1 for maximum sharpness if a clipped edge is
# preferred over softness.
[output:DSI-1]
scale = 0.9

[core]
xwayland = false
