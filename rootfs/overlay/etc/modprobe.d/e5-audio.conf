# The UMP9620 codec takes its analog supplies (VB, BIAS, HEADMICBIAS, DAHPL_CHN)
# from the codec power regulators, which the -power-dev module instantiates.
# udev autoloads the codec by modalias long before e5-audio-dsp gets to the
# power modules; the codec then probes against dummy regulators, the AO buffer
# DC calibration never completes ("cal_done failed -110", ANA_CDC7 stays 0) and
# the speaker is silent.  Load the regulators first, whoever loads the codec.
softdep snd-soc-sprd-codec-ump9620 pre: snd-soc-sprd-codec-ump9620-power snd-soc-sprd-codec-ump9620-power-dev
