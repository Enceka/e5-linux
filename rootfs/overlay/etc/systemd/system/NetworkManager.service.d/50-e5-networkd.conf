[Unit]
# Pull systemd-networkd in for usb0's management network (see
# /etc/systemd/network/10-e5-usb0.network), plus the busybox telnetd that rides on it.
# A drop-in rather than an enable symlink: the overlay travels into the initramfs and
# cannot carry symlinks.
Wants=systemd-networkd.service
Wants=e5-telnetd.service
After=systemd-networkd.service
