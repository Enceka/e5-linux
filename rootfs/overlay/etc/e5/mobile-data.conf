# APN for the data bearer.
#
# This file is the *override*, not the source of truth.  unisoc-cpd resolves the
# APN in this order:
#
#   1. an argument -- "unisoc-cpd data up <apn>"
#   2. this file -- the APN= line below, when it is not commented out
#   3. the modem's own PDP context -- "AT+CGDCONT?" for the profile's cid, which
#      is what Android (or the factory) configured, and usually the right answer
#   4. the SIM's home operator -- "AT+CIMI" gives the MCC-MNC, and the daemon
#      carries a small table for it (46000 cmnet, 46001 3gnet, 46011 ctlte,
#      46015 cbnet, ...; see APN_BY_MCCMNC in src/capability/data.rs)
#
# So a card the modem already knows, or one the table knows, needs nothing here:
# the line stays commented out and the bearer is automatic.  Uncomment it to pin
# a specific APN -- and check what was chosen with "unisoc-cpd data apn", which
# prints the value and the source it came from.
#
#   China Mobile (46000):     cmnet
#   China Unicom (46001):     3gnet
#   China Telecom (46011):    ctlte
#   China Broadnet (46015):   cbnet
#
#APN=cbnet
