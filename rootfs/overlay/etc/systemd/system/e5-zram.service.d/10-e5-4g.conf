# The initramfs carries an overlay (boot-linux-slotb.img) that writes
# /usr/local/sbin/e5-zram on *every* boot, so a change made only in the rootfs is
# reverted.  A drop-in is not in that overlay, which is why the 4 GiB/zstd setting
# lives here: set the size the script reads, and reset+select zstd before it runs.
[Service]
Environment=E5_ZRAM_SIZE=4G E5_ZRAM_COMP=zstd
ExecStartPre=/bin/sh -c 'echo 1 > /sys/block/zram0/reset; echo zstd > /sys/block/zram0/comp_algorithm 2>/dev/null || true'
