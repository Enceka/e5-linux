# Only errors and worse reach the console once the real root is up.
#
# The consoles are ttyS1 (115200 baud) and tty0, and printk writes to them
# synchronously in whoever printed: at console level 7 one info line cost
# 10.3 ms, at 4 it costs nothing measurable.  sprd_drm prints three info lines
# on every atomic commit, so each of phoc's screen updates stalled ~30 ms in
# the kernel, and the Wi-Fi driver prints per ARP/DNS packet.  boot/init keeps
# level 7 inside the initramfs, where the serial console is the only witness.
#
# Nothing is lost: the ring buffer (dmesg), the journal and pstore's panic dump
# keep every level; only the console stops being written.
kernel.printk = 4 4 1 7
