# The bootloader hands over with the SoC watchdog already armed: LK logs "wdt was
# enabled by miscdata" and passes sprdboot.wdten=e551 / androidboot.dswdten=enabled.
# Android's healthd pets it through /dev/watchdog; a stock Debian expects the
# administrator to, and nothing else in this image does.  The hardware therefore
# expires about five minutes after handover and resets the device with no kernel
# message at all -- the silent ~300 s reboot written up in docs/FINDINGS.md.
#
# Feeding it from systemd is the way this is meant to be done: PID 1 owns the timer
# and holds the device open, so the pet does not depend on any user session
# surviving, and a real hang still resets the device.
[Manager]
RuntimeWatchdogSec=60s
