# Phosh is the only session this image installs -- the Plasma half was dropped on
# 2026-09-19 (rootfs/packages.list) -- so there is nothing to choose between here: this
# is the autologin, and the display server is Wayland.
[Autologin]
User=e5
Session=phosh.desktop
Relogin=false

[General]
# SDDM's default DisplayServer is x11.  X is not installed on this image (it came
# in with kwin-x11, which packages.list no longer has), so a manual `systemctl restart sddm`
# makes it try /usr/bin/X, fail three times, and export DISPLAY=:0 into the
# session environment -- after which phosh dies with
# `cannot open display: :0` and the screen stays dark until a reboot.  A normal
# boot never gets there because autologin skips the greeter, which is why this
# only shows up when the display manager is touched by hand.
DisplayServer=wayland
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
