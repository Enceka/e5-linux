interface=wlan0
# the AP is a port of br0, the LAN it shares with usb0 (opt/e5/net-bridge.sh);
# hostapd adds it only if br0 exists when it starts (opt/e5/hotspot-start.sh)
bridge=br0
driver=nl80211
ssid=E5-Linux
hw_mode=a
channel=36
ieee80211n=1
ieee80211ac=1
ieee80211d=0
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
