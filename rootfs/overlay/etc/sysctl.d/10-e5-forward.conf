# The USB LAN is routed through the baseband bearer, so the E5 has to forward.
net.ipv4.ip_forward=1
# and IPv6: the bearer's /64 is passed through to the hotspot (opt/e5/e5-ipv6-share).
# With forwarding on the kernel ignores router advertisements on interfaces
# with accept_ra=1; the script sets 2 on the uplink.
net.ipv6.conf.all.forwarding=1
