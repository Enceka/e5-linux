# Nothing on the E5 waits for NetworkManager: the LAN (br0, usb0) is
# e5-net-bridge's, the mobile data comes up whenever the CP has booted and
# registered (a minute or more), and a Wi-Fi station connection when a user
# asks for it.  Holding
# network-online.target on it is what once cost minutes at every boot
# (docs/FINDINGS.md 26), so this unit is a no-op, like
# systemd-networkd-wait-online's.
[Service]
ExecStart=
ExecStart=/bin/true
