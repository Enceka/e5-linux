# phoc configuration for the E5.
#
# The panel is 320x480 at ~166 DPI while phosh lays its UI out for something closer
# to 360x720, so the output scale is a compromise.  Three things were measured:
#
#   * the on-screen keyboard's layout is ~339 logical px wide at
#     text-scaling-factor 0.85, so the scale has to leave at least that much
#     (320/scale >= 339 at ts 0.85);
#   * phosh's lock screen wants ~575 logical px of height, which 480/scale only
#     reaches below ~0.84 -- at 0.9 its unlock button is half below the screen;
#   * physical text size is text-scaling-factor * scale, and the keyboard
#     constraint caps that product at ~0.8 whatever the split is.
#
#    scale  text  physical  resample  keyboard    lock screen
#    1.00   0.85  0.85      0%        cut right   cut
#    0.90   0.85  0.765     10%       fits        unlock button half off  <- set
#    0.85   0.90  0.765     15%       fits        unlock button barely cut
#    0.80   0.85  0.68      20%       fits        fits (text too small)
#    0.75   1.00  0.75      25%       fits        fits (visibly soft)
#
# 0.9 wins on sharpness and in-system text size, and the lock screen's unlock
# button does not matter any more: the keypad's confirm key submits the PIN as
# KP_Enter (docs/FINDINGS.md 12.1), and the arrow keys can reach the button if
# touch is preferred.  If the button has to be visible, 0.85 is the next step.
[output:DSI-1]
scale = 0.9

[core]
xwayland = false
