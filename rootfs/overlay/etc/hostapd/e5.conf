interface=wlan0
driver=nl80211
ssid=E5-Linux
country_code=CN
# 5 GHz, channel 149, 20 MHz.  Anything wider makes hostapd stall in HT_SCAN on this driver
# ("COUNTRY_UPDATE->HT_SCAN" and never AP-ENABLED), with 40 MHz (ht_capab=[HT40+]) just as
# much as 80 MHz, and pre-setting "iw dev wlan0 set channel 149 80MHZ" while the interface
# is down does not avoid it either.  The vendor ini files (BW80M, VHT80_Power_offset) show
# the *firmware* supports 80 MHz -- Android's SoftAP uses it -- so the missing piece is in
# hostapd/driver interaction, not the hardware.
hw_mode=a
channel=149
ieee80211d=1
ieee80211n=1
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
