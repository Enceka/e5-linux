# HiFi verb for the E5.  The values are the mixer state the device's own Android
# holds while it plays media through the speaker (captured with tinymix during
# playback and diffed against Linux), with two deliberate departures: Speaker
# Mute stays off and Speaker Function on -- on this kernel the board mute
# disables the Ext Spk pin and forces the aw87xxx hook to "off", while
# Android's vendor build reaches the amp another way.
#
# Signal path: FE_FAST (hw:N,3) -> AGDSP FAST_P scene -> VBC DAC0 -> IIS0 ->
# UMP9620 DAC -> AO driver (AOL/AOR) -> aw87xxx on i2c-6 (profile "Music",
# switched by the Speaker DAPM event) -> speaker.

SectionVerb {
	EnableSequence [
		# the stream goes to the codec back ends, not the SMTPA ones
		cset "name='S_NORMAL_AP01_P_SMTPA SWITCH' off"
		cset "name='S_NORMAL_AP23_P_SMTPA SWITCH' off"
		cset "name='S_NORMAL_AP01_P_CODEC SWITCH' on"
		cset "name='S_NORMAL_AP23_P_CODEC SWITCH' on"
		cset "name='S_FAST_P_CODEC SWITCH' on"
		cset "name='S_FAST_P_SMART_AMP SWITCH' on"
		cset "name='S_OFFLOAD_CODEC SWITCH' on"
		cset "name='agdsp_access_en' 1"

		# VBC: DSP DAC0 unmuted with the step Android uses, AP-side MDG open
		cset "name='VBC DAC0 DG Set' 39,39"
		cset "name='VBC DAC0 DSP MDG Set' 0,1024"
		cset "name='VBC DAC0 AUD MDG Set' 0,0"
		cset "name='DSP_DAC0_LR_EXCHANGE' enable"

		# VBC <-> codec IIS: port selection and word widths
		cset "name='VBC_MUX_DAC1_IIS_PORT_SEL' VBC_IIS_PORT_IIS0"
		cset "name='VBC_MUX_IIS3_PORT_DO_SEL' IIS_DO_VAL_DAC2"
		cset "name='VBC_IIS_TX1_WD_SEL' WD_24BIT"
		cset "name='VBC_IIS_TX0_LRMOD_SEL' RIGHT_HIGH"
		cset "name='VBC_IIS_MST_WIDTH_SET' MST_WD_16BIT"
		cset "name='ag_iis0_ext_sel_v2' aud_4ad_iis0_da0"

		# codec: DAC and AO gains, AO driver selection
		cset "name='Inter PA Config' 303"
		cset "name='DAC Gain DAC Playback Volume' 0"
		cset "name='AO Gain AO Playback Volume' 2"
		cset "name='AOL EAR Sel' AOL"
		cset "name='DA AOR Switch' on"
		cset "name='AO Mixer AOL Switch' on"
		cset "name='AO Mixer AOR Switch' on"
	]
	DisableSequence [
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='Speaker Function' on"
		cset "name='Speaker Mute' off"
		cset "name='Speaker1 Function' off"
	]
	DisableSequence [
		cset "name='Speaker Function' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},3"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
