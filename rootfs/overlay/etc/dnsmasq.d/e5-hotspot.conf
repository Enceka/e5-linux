# DHCP + DNS for both of the E5's LANs: the Wi-Fi hotspot and the USB
# management LAN.
#
# networkd's DHCPServer can hand out addresses but cannot answer queries, so
# clients ended up with a resolver that never replied ("got an address, no
# internet").  dnsmasq serves both, advertises itself, and forwards to the
# resolvers the system already has (/etc/resolv.conf, which e5-mobile-data
# writes from AT+CGCONTRDP).
#
# usb0 used to be the exception -- "usb0's leases stay with systemd-networkd" --
# and that is exactly what stopped the management LAN from working: networkd's
# own configuration of usb0 times out on this kernel
#
#     usb0: Failed to wait for the interface to be initialized: Connection timed out
#
# (the sprd SIPA pseudo-interfaces make its rtnl requests hang), so the address
# lands but the server never starts, and the host is left with a self-assigned
# address until someone types one in by hand.
#
# bind-dynamic, not bind-interfaces: at boot only usb0 exists, and the AP's
# wlan0 appears later (hostapd, from e5-hotspot).
interface=wlan0
interface=usb0
bind-dynamic

# usb0: the management LAN.  .10-.61 leaves .1 (the device) and .92 free, and
# the router option is suppressed: a laptop on this port must keep routing its
# internet traffic through its own default gateway, not through the phone.
dhcp-range=set:usblan,192.168.77.10,192.168.77.61,255.255.255.0,12h
dhcp-option=tag:usblan,option:router
dhcp-option=tag:usblan,option:dns-server,192.168.77.1

# wlan0: the hotspot clients, NATed out through the baseband by e5-mobile-data.
dhcp-range=set:hotspot,192.168.9.10,192.168.9.61,255.255.255.0,12h
dhcp-option=tag:hotspot,option:router,192.168.9.1
dhcp-option=tag:hotspot,option:dns-server,192.168.9.1

# IPv6 on wlan0: the bearer's public /64, which e5-ipv6-share puts on wlan0 as
# <prefix>::1.  constructor:wlan0 advertises whatever global prefix wlan0 holds
# (and follows it when a new bearer brings a new one); clients build SLAAC
# addresses in it, and the RA carries this resolver (RDNSS).  ra-stateless also
# answers stateless DHCPv6 for clients that ask for DNS that way.
enable-ra
dhcp-range=set:hotspot6,::,constructor:wlan0,ra-stateless,64,1h
# [::] = this server's own address in the advertised prefix (the global ::1),
# not the link-local dnsmasq would otherwise put in RDNSS.
dhcp-option=tag:hotspot6,option6:dns-server,[::]
log-dhcp
