# The power key cannot suspend this device: the modem's data path refuses it
# ("sipa 25220000.sipa: thread prepare suspend err" on every attempt), so
# HandlePowerKey=suspend or gsd's power-button-action=suspend do nothing visible.
# logind's "lock" gives the phone behaviour instead: short press locks the session,
# which is phosh's lock screen.  Long press stays ignored (logind's default there is
# poweroff, which is easy to trigger by accident).
[Login]
HandlePowerKey=lock
HandlePowerKeyLongPress=ignore
