# Rongyue E5 (UMS9621 + UMP9620 codec + aw87xxx speaker amp), card sprdphone-sc2730.
#
# The ALSA card driver field is "sprdphone-sc273" (the card name cut to 15
# characters), which is why this directory is named that way.
#
# Only the speaker is described: the card exposes 19 front ends, and without a
# profile PipeWire's ACP probes every one of them -- each open runs an AGDSP
# scene setup, and the voice/FM ones can stall.  Capture is left out until the
# capture DMA actually delivers data.
#
# The AGDSP itself (firmware, parameter profiles) is brought up before any of
# this by /opt/e5/e5-audio-dsp (e5-audio.service).

Syntax 4

SectionUseCase."HiFi" {
	File "/sprdphone-sc273/HiFi.conf"
	Comment "Play HiFi quality Music"
}
