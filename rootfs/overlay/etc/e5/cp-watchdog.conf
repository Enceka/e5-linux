# If the AT channel has not answered for DEAD_AFTER seconds, record the
# evidence and reboot (ACTION=reboot) or only log it (ACTION=log).
# GUARD is the minimum number of seconds between two watchdog reboots; a CP
# that dies again inside it is logged and left alone instead of looping.
ACTION=reboot
DEAD_AFTER=120
CHECK=15
GUARD=900
