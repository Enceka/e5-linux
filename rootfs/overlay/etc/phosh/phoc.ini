# phoc configuration for the E5.
#
# The panel is 320x480 at ~166 DPI and is driven at its own resolution: scale 1,
# one logical pixel per panel pixel, nothing resampled.  Text size is left to
# the user's text-scaling-factor (Settings > Accessibility).
#
# Scales below 1 were tried first (docs/FINDINGS.md 21), because phosh lays its
# UI out for something closer to 360x720: 0.9 gave 355x533 logical pixels,
# resampled down to the panel.  In use it lost more than it gained -- with the
# text scaled up (1.25) buttons ended up off the screen -- so the output stays
# at 1 and the layout problems are dealt with where they occur.  Measured at
# scale 1 then: the on-screen keyboard is ~339 logical px wide at
# text-scaling-factor 0.85 (cut on the right of 320), and the lock screen wants
# ~575 px of height; the keypad's confirm key submits the PIN as KP_Enter
# (docs/FINDINGS.md 12.1), so the unlock button is not needed.
[output:DSI-1]
scale = 1

[core]
xwayland = false
