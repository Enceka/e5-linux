interface=wlan0
driver=nl80211
ssid=E5-Linux
country_code=CN
# 5 GHz, channel 149, 80 MHz: VHT80 with segment centre 155 (5775 MHz), i.e. the block
# 149/153/157/161.  hostapd sets it itself ("Set freq 5745 ... bandwidth=80 MHz,
# cf1=5775"), no need to pre-configure the channel with iw.
#
# The reason this used to stall in HT_SCAN ("COUNTRY_UPDATE->HT_SCAN" and never
# AP-ENABLED) was the regulatory domain, not the width: without the upstream-signed
# regulatory.db in the initramfs + 'iw reg set CN' every 5 GHz channel stays NO-IR and
# hostapd's 40 MHz coexistence scan has nothing to settle on.  With 'country CN: DFS-FCC'
# the driver advertises "5725-5850 @ 80 MHz" and 80 MHz starts reliably (4/4 attempts,
# with and without a prior 'iw scan' and with and without a pre-set channel).
#
# One quirk to know about: the beacon's VHT Capabilities IE advertises
# SupportedChannelWidthSet=0 because the driver's own "hw vht capab: 0x1b07031" has that
# bit clear; the VHT Operation IE does say width=1 (80 MHz).  Clients that trust the
# operation element get 80 MHz (Android's SoftAP does the same thing on this chip).
hw_mode=a
channel=149
ieee80211d=1
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
ieee80211ac=1
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=155
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
