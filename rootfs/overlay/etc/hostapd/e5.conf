interface=wlan0
driver=nl80211
ssid=E5-Linux
country_code=CN
# 5 GHz, channel 149, 80 MHz.  The order matters: hotspot-start sets the type and
# "channel 149 80MHZ" while the interface is *down* and only then brings it up and starts
# hostapd.  If the width is configured after the interface is up (or left to hostapd),
# hostapd stalls in its HT_SCAN state and never reaches AP-ENABLED.  The vendor ini files
# (BW80M, VHT80_Power_offset) confirm the firmware supports 80 MHz.
hw_mode=a
channel=149
ieee80211d=1
ieee80211n=1
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
ieee80211ac=1
vht_capab=[SHORT-GI-80]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=155
wpa=2
wpa_passphrase=12345678
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
