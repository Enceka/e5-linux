# NetworkManager on the E5: Wi-Fi and the mobile data connection.
#
# NM owns wlan0 -- station mode from Phosh's Wi-Fi menu, and the hotspot, which
# is the "Hotspot" connection in /usr/lib/NetworkManager/system-connections (an
# AP that is a port of br0) -- and the modem ModemManager exports, whose primary
# port is wwan0at0: the "Mobile" connection there brings the bearer up and
# configures sipa_eth0, the data interface (docs/FINDINGS.md 37).  Everything
# else stays with what already runs it: br0 and usb0 are the LAN from
# e5-net-bridge (net-bridge.sh), dnsmasq serves DHCP/DNS/RA on br0.  br0 is not
# in the unmanaged list only so that NM can attach the AP to it: NM finds it
# configured by someone else and treats it as external, leaving its addresses
# alone.  sipa_eth0 stays in it: NM configures it through the modem device, as
# it does the net port of any modem, not as an Ethernet device of its own.
#
# The unmanaged list is also what keeps network-online.target quick: the NM of
# older images autoconnected on sipa_dummy0, the sprd-wlan placeholder netdev,
# and held network-online.target for minutes (docs/FINDINGS.md 26).
[main]
plugins=keyfile
# /etc/resolv.conf is a static pair of public resolvers, dnsmasq's upstream too
dns=none
rc-manager=unmanaged
no-auto-default=*

[keyfile]
unmanaged-devices=*,except:interface-name:wlan0,except:interface-name:br0,except:interface-name:wwan0at0

[connectivity]
enabled=false

[device-e5-wlan0]
match-device=interface-name:wlan0
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no
