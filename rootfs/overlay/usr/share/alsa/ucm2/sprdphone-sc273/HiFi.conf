# HiFi verb for the E5.  The values are the mixer state the device's own Android
# holds while it plays media through the speaker (captured with tinymix during
# playback and diffed against Linux), with two deliberate departures: Speaker
# Mute stays off and Speaker Function on -- on this kernel the board mute
# disables the Ext Spk pin and forces the aw87xxx hook to "off", while
# Android's vendor build reaches the amp another way.
#
# Signal path: FE_FAST (hw:N,3) -> AGDSP FAST_P scene -> VBC DAC0 -> IIS0 ->
# UMP9620 DAC -> AO driver (AOL/AOR) -> aw87xxx on i2c-6 (profile "Music",
# switched by the Speaker DAPM event) -> speaker.
#
# Earpiece and Mic come from the HAL's own route table, /odm/etc/audio_route.xml
# (devices/handset, devices/main_mic, be_switch/codec_c, vbc_iis_mux/only_codec_c),
# with the gains of /odm/etc/audio_params/sprd (codec.xml adc*_capture_volume 6,
# audio_pga.xml Music/Handsfree/Record VBC ADC0 DG 0x11).  Capture runs on the
# DSP capture front end FE_CAPTURE_DSP (hw:N,2), mono: in stereo the main mic
# MIC1 lands on the left channel (ADD0_DATA_MIC13 with the ADC LRCLK inverted)
# and the right one carries the unpowered MIC3 ADC, pinned at full scale negative;
# a mono open returns MIC1 alone.

SectionVerb {
	EnableSequence [
		# the stream goes to the codec back ends, not the SMTPA ones
		cset "name='S_NORMAL_AP01_P_SMTPA SWITCH' off"
		cset "name='S_NORMAL_AP23_P_SMTPA SWITCH' off"
		cset "name='S_NORMAL_AP01_P_CODEC SWITCH' on"
		cset "name='S_NORMAL_AP23_P_CODEC SWITCH' on"
		cset "name='S_FAST_P_CODEC SWITCH' on"
		cset "name='S_FAST_P_SMART_AMP SWITCH' on"
		cset "name='S_OFFLOAD_CODEC SWITCH' on"
		cset "name='agdsp_access_en' 1"

		# VBC: DSP DAC0 unmuted with the step Android uses, AP-side MDG open
		cset "name='VBC DAC0 DG Set' 39,39"
		cset "name='VBC DAC0 DSP MDG Set' 0,1024"
		cset "name='VBC DAC0 AUD MDG Set' 0,0"
		cset "name='DSP_DAC0_LR_EXCHANGE' enable"

		# VBC <-> codec IIS: port selection and word widths
		cset "name='VBC_MUX_DAC1_IIS_PORT_SEL' VBC_IIS_PORT_IIS0"
		cset "name='VBC_MUX_IIS3_PORT_DO_SEL' IIS_DO_VAL_DAC2"
		cset "name='VBC_IIS_TX1_WD_SEL' WD_24BIT"
		cset "name='VBC_IIS_TX0_LRMOD_SEL' RIGHT_HIGH"
		cset "name='VBC_IIS_MST_WIDTH_SET' MST_WD_16BIT"
		cset "name='ag_iis0_ext_sel_v2' aud_4ad_iis0_da0"

		# codec: DAC and AO gains, AO driver selection
		cset "name='Inter PA Config' 303"
		cset "name='DAC Gain DAC Playback Volume' 0"
		cset "name='AO Gain AO Playback Volume' 2"
		cset "name='AOL EAR Sel' AOL"
		cset "name='DA AOR Switch' on"
		cset "name='AO Mixer AOL Switch' on"
		cset "name='AO Mixer AOR Switch' on"

		# capture back ends: codec ADC -> AGCP IIS1, and the VBC ADC ports
		cset "name='ag_iis1_ext_sel_v2' aud_4ad_iis0_ad0"
		cset "name='S_NORMAL_AP01_C_CODEC SWITCH' on"
		cset "name='S_NORMAL_AP23_C_CODEC SWITCH' on"
		cset "name='S_CAPTURE_DSP_CODEC SWITCH' on"
		cset "name='VBC_IIS_RX0_WD_SEL' WD_24BIT"
		cset "name='VBC_IIS_RX1_WD_SEL' WD_24BIT"
		cset "name='VBC_IIS_RX2_WD_SEL' WD_24BIT"
		cset "name='VBC_MUX_ADC0_IIS_PORT_SEL' VBC_IIS_PORT_IIS1"
		cset "name='VBC_MUX_ADC1_IIS_PORT_SEL' VBC_IIS_PORT_IIS2"
		cset "name='VBC_MUX_ADC2_IIS_PORT_SEL' VBC_IIS_PORT_IIS1"
		cset "name='VBC ADC0 DG Set' 17,17"
		cset "name='VBC ADC1 DG Set' 17,17"
	]
	DisableSequence [
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
	]

	EnableSequence [
		cset "name='Speaker Function' on"
		cset "name='Speaker Mute' off"
		cset "name='Speaker1 Function' off"
	]
	DisableSequence [
		cset "name='Speaker Function' off"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},3"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Speaker"
	]

	# devices/handset: the receiver hangs off the HPL driver, not the AO one
	EnableSequence [
		cset "name='Speaker Function' off"
		cset "name='DAHP OS D' 5"
		cset "name='EAR_HPL Mixer DACHPL Switch' on"
		cset "name='HPL EAR Sel' EAR"
		cset "name='VBC_MIXER1_DAC0' HALF_ADD"
		cset "name='Earpiece Function' on"
	]
	DisableSequence [
		cset "name='Earpiece Function' off"
		cset "name='EAR_HPL Mixer DACHPL Switch' off"
		cset "name='HPL EAR Sel' HPL"
		cset "name='VBC_MIXER1_DAC0' NOT_MIX"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},3"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	# devices/main_mic
	EnableSequence [
		cset "name='ADD0 DATA SEL' ADD0_DATA_MIC13"
		cset "name='ADC LRCLK Select' invert"
		cset "name='ADC1 LRCLK Select' invert"
		cset "name='ADC_1 Gain ADC_1 Capture Volume' 6"
		cset "name='ADC_1 Mixer MIC1PGA_1 Switch' on"
		cset "name='AUD ADC0L Switch' on"
		cset "name='AUD ADC0R Switch' on"
		cset "name='Mic Function' on"
	]
	DisableSequence [
		cset "name='Mic Function' off"
		cset "name='AUD ADC0L Switch' off"
		cset "name='AUD ADC0R Switch' off"
		cset "name='ADC_1 Mixer MIC1PGA_1 Switch' off"
		cset "name='ADC LRCLK Select' normal"
		cset "name='ADC1 LRCLK Select' normal"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureRate 48000
	}
}
