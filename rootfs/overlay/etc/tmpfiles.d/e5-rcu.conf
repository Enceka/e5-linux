# The bootloader's command line (not ours: LK builds it for Android) carries
# rcupdate.rcu_expedited=1, and on Linux nothing turns it off again, so every
# synchronize_rcu() for the life of the system was an expedited grace period --
# an IPI to all eight cores, idle ones included.  Back to normal grace periods
# once userspace is up; the kernel's own boot is already past by then.
w /sys/kernel/rcu_expedited - - - - 0
