# ModemManager on the E5 probes nothing it was not handed explicitly.
#
# It comes in as a hard dependency of GNOME Calls, and left to its default
# filter it would open every tty to look for a modem: ttyGS0 (the USB serial
# console), ttyBT0 (the Bluetooth controller) and the SIPC AT channels, which
# unisoc-cpd owns alone -- the CP asserts when AT traffic it does not expect
# lands on them (docs/FINDINGS.md 22, 25).  With allowlist-only it only looks
# at ports udev tags ID_MM_DEVICE_PROCESS=1, and none are, so it runs, answers
# Calls and Chatty on D-Bus, and reports no modem.  Exposing the baseband to it
# is the SIM-management work, and is done by tagging exactly the port meant
# for it.
[Service]
ExecStart=
ExecStart=/usr/sbin/ModemManager --filter-policy=allowlist-only
