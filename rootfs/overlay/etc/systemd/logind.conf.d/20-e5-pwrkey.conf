# The power key cannot suspend this device: the modem's data path refuses it
# ("sipa 25220000.sipa: thread prepare suspend err" on every attempt), so
# HandlePowerKey=suspend or gsd's power-button-action=suspend do nothing visible.
#
# logind handles the key itself, which needs no userspace daemon at all -- the
# script that used to do this (/opt/e5/powerkey.py) is gone:
#
#   * short press -> lock: phosh's lock screen;
#   * long press  -> poweroff (logind's own long-press timer);
#   * the panel dims through phoc's idle timer and the panel driver turns the
#     backlight off with it (measured: dpms=Off and bl_power=4 together), and any
#     input wakes it again.
#
# HandlePowerKeyLongPress is set here rather than left at logind's default (it is
# "ignore", which is what made a held key do nothing at all).
[Login]
HandlePowerKey=lock
HandlePowerKeyLongPress=poweroff
