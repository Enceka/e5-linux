# One published input owns the shared DSP capture channel. The session broker
# switches its physical PCM; applications never open the two FEs concurrently.
context.modules = [
  { name = libpipewire-module-pipe-tunnel
    args = {
      tunnel.mode = source
      tunnel.may-pause = false
      pipe.filename = /run/user/1000/e5-capture.pcm
      audio.format = S16
      audio.rate = 48000
      audio.channels = 1
      audio.position = [ MONO ]
      node.name = e5_microphone
      node.description = Microphone
      node.latency = 960/48000
      stream.props = {
        priority.driver = 2000
        priority.session = 2000
        node.autoconnect = true
      }
    }
  }
]
