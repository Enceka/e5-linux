# DHCP + DNS for the E5's Wi-Fi hotspot, and DNS for the USB LAN.
#
# networkd's DHCPServer can hand out addresses but cannot answer queries, so clients
# ended up with a resolver that never replied ("got an address, no internet").  dnsmasq
# serves both: it advertises itself and forwards to the resolvers the system already has
# (/etc/resolv.conf, which e5-mobile-data writes from AT+CGCONTRDP).
interface=wlan0
interface=usb0
bind-interfaces
# DHCP only on the hotspot; usb0's leases stay with systemd-networkd.
no-dhcp-interface=usb0
dhcp-range=192.168.9.10,192.168.9.61,255.255.255.0,12h
dhcp-option=option:router,192.168.9.1
dhcp-option=option:dns-server,192.168.9.1
log-dhcp
