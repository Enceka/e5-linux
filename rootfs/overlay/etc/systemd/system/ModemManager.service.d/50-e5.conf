# ModemManager owns the E5's baseband (docs/FINDINGS.md 37).
#
# It sees exactly two ports: the AT port sipc_wwan registers on the SIPC AT
# channel (e5-sipc-wwan.service loads it) and the sipa_eth0 data interface,
# both tagged by its unisoc plugin's udev rules and handed to it by
# etc/udev/rules.d/78-e5-mm-sipc.rules.  Left to its default filter it would
# open every tty to look for a modem: ttyGS0 (the USB serial console), ttyBT0
# (the Bluetooth controller) -- with allowlist-only it looks at nothing it was
# not handed explicitly.
[Unit]
Wants=e5-sipc-wwan.service
After=e5-sipc-wwan.service
BindsTo=e5-sipc-wwan.service

[Service]
ExecStart=
ExecStart=/usr/sbin/ModemManager --filter-policy=allowlist-only
