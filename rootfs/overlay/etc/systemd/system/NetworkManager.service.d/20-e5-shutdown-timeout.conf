# NetworkManager is the whole reason a shutdown takes half a minute on this
# device.  Measured from the journal of a reboot: every unit stops inside about
# a second (bluetooth.service in 0.25 s, e5-bt-attach.service with it), and then
# there is a 32 s silence whose first line is
#
#     14:57:01.108  NetworkManager: modem-manager: ModemManager no longer available
#
# and whose last line is
#
#     14:57:33.001  NetworkManager: exiting (success)
#     14:57:33.023  systemd[1]: Stopped NetworkManager.service
#
# NM's exit path takes its devices down itself and waits for the operations to
# finish.  On this device the WLAN sits on the WCN chip, whose firmware does not
# answer a disconnect promptly (and the modem's sipa_eth0 bearer is gone by
# then), so the wait runs into NM's own timeout.  None of that work is worth
# half a minute of a user's time, and a SIGKILLed NetworkManager leaves nothing
# behind on disk -- connections and their state are on disk already.
[Service]
TimeoutStopSec=5
