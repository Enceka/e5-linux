# phoc configuration for the E5.
#
# The panel is 320x480 at ~166 DPI.  At the default scale of 1 that leaves 320
# logical pixels and phosh's on-screen keyboard needs about 355 -- its layout is
# built for a slightly wider phone, so the rightmost keys were clipped off the
# edge and unreachable.  At 0.75 the compositor has 426x640 logical pixels and the
# keyboard fits with its proper margins on both sides.
#
# This matches the e5 user's text-scaling-factor, so the UI stays consistent.
# Note the cost: the compositor now rasterises 273k pixels instead of 154k, on the
# CPU, so everything is ~1.8x more expensive.  0.85 (376x565) still clears the
# keyboard and is the next thing to try if this is too slow.
[output:DSI-1]
scale = 0.75

[core]
xwayland = false
