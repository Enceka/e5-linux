# networkd manages no link on this device (the LAN is br0, built with ip by
# e5-net-bridge; the bearer is NetworkManager's), so waiting for a networkd link to
# come online would only time out after two minutes and hold back everything
# ordered after network-online.target (UFI-TOOLS, for one).  The LAN is up when
# e5-net-bridge has run, which is ordered before network.target.
[Service]
ExecStart=
ExecStart=/bin/true
