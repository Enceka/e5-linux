# WirePlumber on the E5's sprdphone-sc2730 card.
#
# The card has 19 front ends (DSP scenes: voice, FM, loopback, dump, ...).  With
# ACP, PipeWire builds a pro-audio profile by opening, configuring and preparing
# every one of them -- each open is an AGDSP scene round trip, most fail
# ("no backend DAIs enabled"), and the probe keeps wireplumber at 100% of a
# core for the first minutes of every session.  PipeWire 1.4 has no switch for
# the pro-audio probe, so ACP is off for this card and only the speaker front
# end (FE_ST_FAST, hw:N,3) becomes a node; the rest are never created, never
# opened.
#
# The speaker's mixer route is still the card's UCM profile (verb HiFi, device
# Speaker), applied at boot by /opt/e5/e5-audio-dsp (e5-audio.service).

monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*", api.alsa.card.name = "sprdphone-sc2730" } ]
    actions = { update-props = { api.alsa.use-acp = false } }
  }
  {
    matches = [ { node.name = "~alsa_.*", api.alsa.card.name = "sprdphone-sc2730" } ]
    actions = { update-props = { node.disabled = true } }
  }
  {
    matches = [ { node.name = "~alsa_output.*", api.alsa.card.name = "sprdphone-sc2730", api.alsa.pcm.device = "3" } ]
    actions = {
      update-props = {
        node.disabled = false
        node.description = "Speaker"
        node.nick = "Speaker"
        priority.driver = 1000
        priority.session = 1000
        audio.rate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
