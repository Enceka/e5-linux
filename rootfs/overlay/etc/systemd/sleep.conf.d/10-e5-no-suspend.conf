[Sleep]
# This board has no RTC and no working suspend/resume chain: the charger, the WCN
# chip and the CP all take part, and none of them is wired up to wake the AP.  Left
# alone, the device was found after a few hours idle with its USB descriptors still
# enumerated, no ARP replies, a dark panel and no key able to wake it.
#
# Refusing to sleep is the honest configuration on this hardware; a suspend that
# cannot be resumed is a hang with extra steps.
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
