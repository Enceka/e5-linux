# APN of the SIM currently in the slot -- one line, and it has to match the
# card: swapping SIMs means editing this file (the daemon's `data up` reads it
# when no APN is given on the command line).
#
#   China Mobile (46000): cmnet
#   China Unicom (46001): 3gnet
#   China Broadnet (46015): cbnet
APN=cbnet
